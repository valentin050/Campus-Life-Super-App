<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dining | Campus Life</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <!-- Shared campus navigation -->
  <header>
    <nav class="container campus-nav" aria-label="Main navigation">
      <strong>Campus Life</strong>
      <a href="index.html">Home</a>
      <a href="dining.html" aria-current="page">Dining</a>
      <a href="map.html">Campus Map</a>
    </nav>
  </header>
  <main class="container py-4">
    <h1>Find a place to eat</h1>
    <p>Sample hours for the MVP. <a href="https://www.lynchburg.edu/">Check university resources for current hours.</a></p>
    <!-- The selector changes the hours displayed below. -->
    <label for="day" class="form-label">Show hours for</label>
    <select id="day" class="form-select mb-3">
      <option value="weekday">Monday–Friday</option>
      <option value="weekend">Saturday–Sunday</option>
    </select>
    <section class="panel mb-3">
      <h2>Burton Dining Hall</h2>
      <p>Drysdale Student Center</p>
      <p id="dining-hours" role="status">7:30 AM–8:00 PM</p>
    </section>
    <section class="panel">
      <h2>Westover Room</h2>
      <p>Drysdale Student Center</p>
      <p id="westover-hours" role="status">11:00 AM–9:00 PM</p>
    </section>
  </main>
  <footer class="container py-3"><a href="https://www.lynchburg.edu/">University of Lynchburg</a></footer>
</body>
</html>
