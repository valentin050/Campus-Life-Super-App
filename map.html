<!DOCTYPE html>
<html lang="en">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<body>
  <!-- Shared campus navigation -->

    <nav class="container campus-nav" aria-label="Main navigation">

      <a href="map.html" aria-current="page">Campus Map</a>

  <main class="container py-4">
    <h1>Find your way around</h1>

      <section class="col-md-8">
        <h2>Campus map</h2>

      </section>
      <section class="col-md-4"><div class="panel">
        <h2>Campus locations</h2>
        <ol>
          <li>Burton Dining Hall (Drysdale Student Center)</li>
          <li>Knight-Capron Library</li>
          <li>Drysdale Student Center</li>
        </ol>
      </div></section>
    </div>
  </main>
  <footer class="container py-3"><a href="https://www.lynchburg.edu/">University of Lynchburg</a></footer>
