<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home | Campus Life</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <!-- Shared campus navigation -->
  <header>
    <nav class="container campus-nav" aria-label="Main navigation">
      <strong>Campus Life</strong>
      <a href="index.html" aria-current="page">Home</a>
      <a href="dining.html">Dining</a>
      <a href="map.html">Campus Map</a>
    </nav>
  </header>
  <main class="container py-4">
    <h1>Weather in Lynchburg</h1>
    <!-- Weather results are updated by script.js. -->
    <div class="row g-3 mb-3">
      <section class="col-md-6"><div class="panel h-100">
        <h2>Current conditions</h2>
        <p id="weather" role="status">Loading weather…</p>
        <button id="refresh" class="btn btn-outline-primary">Refresh weather</button>
      </div></section>
      <section class="col-md-6"><div class="panel h-100">
        <h2>Weather alerts</h2>
        <p id="alerts" role="status">Checking alerts…</p>
      </div></section>
    </div>
    <a class="btn btn-primary" href="dining.html">See dining hours</a>
    <a class="btn btn-outline-primary" href="map.html">Open campus map</a>
  </main>
  <footer class="container py-3"><a href="https://www.lynchburg.edu/">University of Lynchburg</a></footer>
</body>
</html>
